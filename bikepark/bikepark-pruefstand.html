<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bikepark-Prüfstand</title>
<style>
  :root{
    --bg:#0a0a0c; --bg-2:#101015; --line:#4fd1c5; --jump:#ff9d4d;
    --wall:#d9a441; --dim:#8b8b95; --fg:#e8e8ee;
    --glass:rgba(255,255,255,.045); --stroke:rgba(255,255,255,.09);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
    font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    -webkit-font-smoothing:antialiased}
  #scene{display:block;width:100%;height:100svh}
  .glass{background:var(--glass);border:1px solid var(--stroke);border-radius:14px;
    backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%)}

  /* --- HUD --- */
  #hud{position:fixed;inset:auto auto 18px 18px;padding:14px 16px;min-width:206px;
    pointer-events:none;opacity:0;transition:opacity .5s ease}
  #hud.on{opacity:1}
  #hud .big{font-size:34px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  #hud .u{font-size:11px;color:var(--dim);margin-left:5px}
  #hud .row{display:flex;justify-content:space-between;gap:18px;font-size:11px;
    color:var(--dim);margin-top:5px;font-variant-numeric:tabular-nums}
  #hud .row b{color:var(--fg);font-weight:400}
  #bar{height:3px;background:rgba(255,255,255,.09);border-radius:2px;margin-top:11px;overflow:hidden}
  #bar i{display:block;height:100%;width:0;background:var(--line);transition:width .12s linear}

  /* Bleibt rechts vom HUD: bei 1280 px reicht 88vw sonst bis unter den Tacho. */
  #elem{position:fixed;left:calc(50% + 110px);bottom:26px;transform:translateX(-50%);
    padding:9px 18px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;
    color:var(--jump);opacity:0;transition:opacity .3s ease;pointer-events:none;
    white-space:nowrap;max-width:min(62vw,760px);overflow:hidden;text-overflow:ellipsis}
  @media (max-width:760px){
    #elem{left:50%;bottom:14px;max-width:92vw;font-size:11px}
    #hud{inset:auto auto 58px 12px;padding:10px 12px;min-width:0}
    #hud .big{font-size:26px}
    #right{top:12px;right:12px;font-size:10px}
  }
  #elem.on{opacity:1}

  #right{position:fixed;top:18px;right:18px;padding:12px 14px;font-size:11px;color:var(--dim);
    opacity:0;transition:opacity .5s ease;pointer-events:none;text-align:right}
  #right.on{opacity:1}
  #right b{color:var(--fg);font-weight:400}
  #right .k{display:inline-block;padding:1px 5px;border:1px solid var(--stroke);border-radius:4px;
    margin-left:4px;color:var(--fg)}

  /* --- Startbildschirm --- */
  #start{position:fixed;inset:0;display:grid;place-items:center;padding:24px;
    background:radial-gradient(120% 90% at 50% 0%,#14141b 0%,#0a0a0c 62%);z-index:10;
    overflow-y:auto}
  #start.gone{display:none}
  #panel{width:min(860px,100%);padding:30px}
  h1{margin:0;font-size:25px;letter-spacing:-.02em;font-weight:500}
  .sub{color:var(--dim);font-size:12px;margin:8px 0 26px}
  .lbl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.09em;margin:0 0 10px}
  .grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-bottom:24px}
  .card{padding:14px 16px;border-radius:12px;border:1px solid var(--stroke);background:var(--glass);
    cursor:pointer;transition:border-color .2s ease,background .2s ease;text-align:left;
    color:inherit;font:inherit}
  .card:hover{border-color:rgba(79,209,197,.4)}
  .card:focus-visible{outline:2px solid var(--line);outline-offset:2px}
  .card[aria-pressed=true]{border-color:var(--line);background:rgba(79,209,197,.09)}
  .card .n{font-size:15px;margin-bottom:5px}
  .card .d{font-size:11px;color:var(--dim);line-height:1.55}
  #go{width:100%;padding:15px;border-radius:12px;border:1px solid var(--line);
    background:rgba(79,209,197,.13);color:var(--fg);font:inherit;font-size:14px;cursor:pointer;
    transition:background .2s ease}
  #go:hover{background:rgba(79,209,197,.22)}
  #go:focus-visible{outline:2px solid var(--line);outline-offset:2px}
  #note{margin-top:16px;font-size:11px;color:var(--dim);line-height:1.7}
  #note code{color:var(--line)}
  #err{margin-top:14px;padding:11px 13px;border-radius:9px;font-size:11px;line-height:1.65;
    border:1px solid rgba(255,157,77,.35);background:rgba(255,157,77,.07);color:#ffc79a;display:none}
  #err.on{display:block}

  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<noscript>Für diese Ansicht wird JavaScript benötigt.</noscript>

<div id="hud" class="glass">
  <div><span class="big" id="kmh">0</span><span class="u">km/h</span></div>
  <div class="row"><span>Zeit</span><b id="t">0:00.0</b></div>
  <div class="row"><span>Strecke</span><b id="d">0 / 0 m</b></div>
  <div class="row"><span>Höhe</span><b id="h">0 m</b></div>
  <div class="row"><span>Luft</span><b id="air">0,0 s</b></div>
  <div id="bar"><i></i></div>
</div>

<div id="right" class="glass">
  <div><b id="vname">—</b></div>
  <div style="margin-top:6px">Gas<span class="k">W</span> Bremse<span class="k">S</span></div>
  <div>Links/Rechts<span class="k">A</span><span class="k">D</span></div>
  <div>Rad wechseln<span class="k">1</span><span class="k">2</span></div>
  <div>Kamera<span class="k">C</span> Neustart<span class="k">R</span></div>
</div>

<div id="elem" class="glass"></div>

<div id="start">
  <div id="panel" class="glass">
    <h1>Bikepark-Prüfstand</h1>
    <p class="sub">Drei Streckenpläne, aus der Elementliste gebaut — nicht zufällig erzeugt.
      Bei jedem Run liegt derselbe Sprung an derselben Stelle.</p>

    <p class="lbl">Strecke</p>
    <div class="grid" id="tracks"></div>

    <p class="lbl">Rad</p>
    <div class="grid" id="bikes"></div>

    <button id="go">Abfahrt</button>
    <p id="note"></p>
    <div id="err"></div>
  </div>
</div>

{"imports":{
  "three":"https://unpkg.com/three@0.185.1/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.185.1/examples/jsm/"
}}
</script>

<script id="strecken" type="application/json">{"strecken":[{"key":"downhill-republic","name":"Downhill Republic","laenge_m":1900,"hoehendifferenz_m":300,"begruendung":"ALLE 20 BEANSTANDUNGEN SIND EINGEARBEITET. Weil sechs davon (Bremswege, Ballistik, Fussabdruecke, der 581-m-Sektionsbruch) sich gegenseitig blockierten, wurde die Strecke neu geordnet statt punktuell geflickt; Gelaendeanker (Felsnase-Wallride oben, Steilstufe vor dem Schluesselabschnitt, Schlussteil Steilhang-Steinfeld-Zielanlieger) sind erhalten.\n\nMASSKONVENTION (Antwort auf Beanstandung idx26): laenge_m bedeutet ab jetzt einheitlich fuer tabletop und step_down/step_up das Bauwerk nach Vorgabemass (Tabletop 3-9 m), fuer kicker den vollen Fussabdruck aus Rampe + Gap + Landung. Damit die Rampen und Landungen der Tabletops real Platz haben, betraegt der Abstand innerhalb jeder Sektion konsequent 13 m: die tiefste Landung braucht 4,4-4,8 m, die hoechste Rampe (2,2 m bei 15 Grad) 8,2 m, zusammen 12,7 m < 13 m. Kein Tabletop ist mehr hoeher als 2,2 m, der 2,6-m-Table ist ersatzlos entfallen. 13 m ist zugleich kleiner als die von Regel 4 geforderten 15 m Hoechstabstand.\n\nFUSSABDRUECKE STATT UEBERLAPPUNGEN (idx20, idx25, idx12, idx8): jeder Kicker traegt jetzt seinen echten Fussabdruck. 1,5 m Rampe 5,6 + 8 Gap + 4,4 Landung = 18 m (396); 1,8 m: 6,7 + 9,5 + 4,8 = 21 m (980); 2,3 m: 8,6 + 12 + 4,4 = 25 m (1201); 1,3 m: 4,9 + 6,5 + 4,6 = 16 m (1610). Die frueheren Ueberlappungen von 3 bzw. 4 m existieren nicht mehr, die in den Notizen genannten Abstaende sind gerechnet und stimmen.\n\nGROESSTER SPRUNG (idx25, Regel 6): Kicker bei 1201 m = 63,2 Prozent, gapweite 12 m und absprunghoehe 2,3 m sind beide Streckenmaximum, der hoechste Table (2,2 m) liegt bei 1239 m = 65,2 Prozent, also ebenfalls im Fenster - die Regel ist eindeutig erfuellt, egal ob nach gapweite_m oder hoehe_m geprueft wird. Der Pruefer schlug 13 m Gap vor; das Rahmenmass laesst nur 3-12 m zu, deshalb 12 m plus 35 m statt 55 m Anfahrt unter dem Steilstueck und ein auf 1,8 m gesenkter Kalibrier-Table davor (idx24), sodass die reale Anfahrt in der Mitte des Geschwindigkeitsfensters liegt.\n\nBREMSWEGE (idx1, idx10, idx11, idx28, idx32): jede Sektion beginnt jetzt 35-39 m unter dem Ende des vorangehenden Steilstuecks statt 14-30 m, und die Steilstuecke sind auf 60-70 m begrenzt. Startrampe auf 60 m gekuerzt und Steinfeld auf 100 m verschoben: 40 m Bremsweg statt 10. Der frueher kritische Step-up bei 424 m ist entfallen; die Sektion dort beginnt bei 375 m, 35 m unter dem Steilstueck. Der Anlieger vor der zweiten Holzwand folgt keinem Steilstueck mehr, sondern liegt 23 m hinter der Schluesselsektion, ist auf 4 m verbreitert, und der Abstand Anlieger-Wallride ist von 9 auf 16 m gewachsen. Das Schluss-Steinfeld liegt 140 m unter dem Ende des letzten Steilhangs und 43 m hinter dem letzten Table - der Bremsweg ist mehr als verdoppelt.\n\nZU LANGSAME SPRUENGE (idx6, idx8): die erste Jumpline steht nicht mehr 6 m hinter einer Wallride-Ausleitung. Wo eine Gruppe doch aus einem Ausleitungsanlieger heraus anfaehrt (1395 m), sind die Tables auf 1,4-1,6 m verkleinert und der Kicker mit 6,5 m Gap erst 215 m spaeter angesetzt, wo der Absatz wieder Anlauf gibt.\n\nDROP-RAHMENMASS (idx18): Hoehenversatz des Step-downs von 1,5 auf 0,9 m reduziert, damit das Element auch abgerollt unter der 0,9-m-Grenze bleibt; eine Sonderauslegung ist damit nicht mehr noetig.\n\nREGEL 4, DER 581-M-BRUCH (idx26): geloest, nicht kaschiert. Sieben Rhythmus-Sektionen zu je drei Sprungelementen (375, 583, 782, 980, 1180, 1395, 1589), Erholungen dazwischen 148, 148, 148, 136, 148, 148 m - alle im Fenster 80-150. Die letzte Sektion endet bei 1647 m; bis zum Beginn der nach Regel 7 zwingend sprungfreien letzten 120 m (1780 m) sind es 133 m, also wieder eine regelkonforme Erholung. Laengste sprungfreie Strecke ausserhalb der Regel-7-Zone: 148 m statt 581 m. Der frueher fuenf Elemente lange sprungfreie Schlussteil wurde dafuer auf Steilhang - Schlusssektion - Steinfeld - Zielanlieger umgebaut, die Anlieger-Wallride-Kombination ist wie vom Pruefer vorgeschlagen nach oben in die Erholung 1247-1395 gerutscht.\n\nWIDERSPRUCH MIT GEGENRECHNUNG (breite_m bei steinfeld, kicker, hip): der Pruefer verlangt breite_m fuer beide Steinfelder, alle Kicker und den Hip. Die verbindliche Feldliste sieht breite_m ausschliesslich fuer anlieger und tabletop vor; ein zusaetzliches Feld waere ein neuer Regelbruch (\"keine anderen Typen erfinden\"). Die Masse werden deshalb hier festgehalten statt erfunden: beide Steinfelder 3,0 m (unter der 4-m-Grenze fuer technisches Gelaende), alle vier Kicker und der Hip 5,0-6,0 m wie die benachbarten Tabletops derselben Sektion. Die Trassenbreite ist damit ueber die Tabletops jeder Sektion belegbar: 5,0-6,0 m auf der Jumpline, 3,5-4,5 m in den Anliegern.\n\nSTRUKTURPRUEFUNG NACH DER KORREKTUR: 34 Elemente, strikt aufsteigend, jede Pruefung start_m[i]+laenge_m[i] <= start_m[i+1] haelt (engste Stellen 6 m hinter beiden Wallrides). Regel 1: beide Waende haben gleichgerichteten Anlieger davor (145 rechts vor 187 rechts, 1270 links vor 1312 links) und eine Ausleitung dahinter (213, 1340). Regel 2: zwei Waende, 1125 m Abstand. Regel 3: erstes Sprungelement bei 375 m. Regel 5: Steinfeld 100 vor Anlieger 145, Steinfeld 1690 vor Zielanlieger 1790, keines hinter einem Anlieger. Regel 7: zwischen 1780 und 1900 nur der Zielanlieger. Regel 8: alle vier Steilstuecke leiten ein (60 zu Steinfeld 100 = 40 m; 340 zu Sektion 375 = 35 m; 1145 zu 1180 = 35 m; 1550 zu 1589 = 39 m). Rahmenmasse: Tabletops 6-9 m und 1,4-2,2 m; Wallrides 20/22 m, 3,4/3,0 m, 78/76 Grad; Anlieger 1,3-1,7 m und 30-38 Grad; Kicker 1,3-2,3 m Absprung, 6,5-12 m Gap, 0,5-1,2 m Grube. Hoehenprofil monoton von 300,0 auf 0,0, ohne einen einzigen Gegenanstieg: vier Steilstufen mit 26-30 Prozent (270 m Gesamtlaenge, 77 hm), Sprungabsaetze mit 9-10 Prozent, Verbindungstraversen mit 14-18 Prozent, Zielgerade 11,9 Prozent.","hoehenprofil":[{"s_m":0,"hoehe_m":300.0},{"s_m":60,"hoehe_m":283.2},{"s_m":100,"hoehe_m":277.6},{"s_m":145,"hoehe_m":272.2},{"s_m":213,"hoehe_m":265.4},{"s_m":270,"hoehe_m":256.3},{"s_m":340,"hoehe_m":235.3},{"s_m":375,"hoehe_m":230.4},{"s_m":435,"hoehe_m":224.4},{"s_m":583,"hoehe_m":197.7},{"s_m":634,"hoehe_m":193.2},{"s_m":782,"hoehe_m":166.5},{"s_m":832,"hoehe_m":162.0},{"s_m":980,"hoehe_m":135.4},{"s_m":1044,"hoehe_m":129.0},{"s_m":1075,"hoehe_m":124.6},{"s_m":1145,"hoehe_m":103.6},{"s_m":1180,"hoehe_m":98.7},{"s_m":1247,"hoehe_m":92.0},{"s_m":1366,"hoehe_m":75.4},{"s_m":1395,"hoehe_m":71.9},{"s_m":1441,"hoehe_m":67.8},{"s_m":1480,"hoehe_m":61.9},{"s_m":1550,"hoehe_m":43.7},{"s_m":1589,"hoehe_m":38.2},{"s_m":1647,"hoehe_m":33.0},{"s_m":1722,"hoehe_m":24.0},{"s_m":1790,"hoehe_m":13.1},{"s_m":1830,"hoehe_m":8.3},{"s_m":1900,"hoehe_m":0.0}],"elemente":[{"typ":"steilstueck","start_m":0,"laenge_m":60,"gefaelle_prozent":28,"notiz":"Startet direkt unter der Bergstation und ist auf 60 m gekuerzt, damit zwischen seinem Ende bei 60 m und dem Steinfeld bei 100 m 40 m Bremsweg liegen, die die rollende Anfahrt von rund 15,5 m/s wieder auf Steinfeldtempo bringen."},{"typ":"steinfeld","start_m":100,"laenge_m":32,"notiz":"Liegt 40 m unter dem Auslauf der Startrampe und noch vor dem ersten Anlieger bei 145 m, damit die Steine gerade und abgebremst angefahren werden und der Kurvendruck erst dahinter aufgebaut wird."},{"typ":"anlieger","start_m":145,"laenge_m":26,"richtung":"rechts","neigung_grad":38,"hoehe_m":1.6,"breite_m":3.5,"notiz":"Steht 13 m hinter dem Steinfeld und 16 m vor der Holzwand und legt den Fahrer schon vor dem Wandkontakt in dieselbe Rechtskurve, die der Wallride ab 187 m verlangt."},{"typ":"wallride","start_m":187,"laenge_m":20,"seite":"rechts","hoehe_m":3.4,"neigung_grad":78,"material":"holz","notiz":"Ersetzt an der Felsnase am rechten Hangrand die Kurve, fuer die dort kein Platz ist: angefahren aus dem Rechtsanlieger, der 16 m davor endet, verlassen ueber die Ausleitung ab 213 m."},{"typ":"anlieger","start_m":213,"laenge_m":26,"richtung":"links","neigung_grad":30,"hoehe_m":1.3,"breite_m":3.6,"notiz":"Ausleitung der Wand sechs Meter hinter deren Ende: faengt den Fahrer beim Abkippen ab und uebergibt ihn geradegestellt an das Steilstueck, das 31 m weiter unten ansetzt."},{"typ":"steilstueck","start_m":270,"laenge_m":70,"gefaelle_prozent":30,"notiz":"Beginnt 31 m hinter der Wallride-Ausleitung an der Gelaendekante und leitet die erste Rhythmussektion ein, deren erster Table 35 m unter seinem Ende auf dem 10-Prozent-Absatz steht."},{"typ":"tabletop","start_m":375,"laenge_m":8,"hoehe_m":1.8,"breite_m":5.5,"notiz":"Erster Sprung der Strecke, 35 m unter dem Steilstueck gesetzt, wo der Absatz auf 10 Prozent zurueckgeht und der Anlauf abgebaut ist; 13 m weiter uebernimmt der Kicker bei 396 m."},{"typ":"kicker","start_m":396,"laenge_m":18,"absprunghoehe_m":1.5,"gapweite_m":8,"grubentiefe_m":0.7,"notiz":"Sitzt 13 m hinter der Table-Landung; der Fussabdruck aus 5,6 m Rampe, 8 m Gap und 4,4 m Landung endet bei 414 m und laesst 13 m Rollweg bis zum Schlusstable bei 427 m."},{"typ":"tabletop","start_m":427,"laenge_m":8,"hoehe_m":1.9,"breite_m":5.5,"notiz":"Schliesst die Sektion 13 m hinter der Kicker-Landung ab, weil der flache Absatz bei 435 m endet und danach 148 m Traverse ohne Sprungelement folgen."},{"typ":"tabletop","start_m":583,"laenge_m":9,"hoehe_m":2,"breite_m":6,"notiz":"Eroeffnet 148 m nach dem letzten Table der ersten Sektion die Jumpline des Mittelteils, dort wo der Hang auf 9 Prozent zurueckgeht, und uebergibt 13 m spaeter an den Hip."},{"typ":"hip","start_m":605,"laenge_m":8,"hoehe_m":1.8,"seitenversatz_m":2.5,"richtung":"links","notiz":"Nutzt die 13 m hinter der Table-Landung nach links wegfallende Gelaendekante und versetzt die Linie seitlich, bevor der Table bei 626 m sie zurueck in die Falllinie holt."},{"typ":"tabletop","start_m":626,"laenge_m":8,"hoehe_m":1.9,"breite_m":6,"notiz":"Holt die Linie 13 m nach dem Hip zurueck in die Falllinie und beendet die Sektion, weil ab 634 m die 148 m lange 18-Prozent-Traverse zur naechsten Gruppe beginnt."},{"typ":"tabletop","start_m":782,"laenge_m":8,"hoehe_m":1.9,"breite_m":6,"notiz":"Steht am Ende der 148-m-Traverse auf dem ersten flachen Absatz und eroeffnet die Gruppe, deren natuerliche Kante 13 m weiter den Step-down traegt."},{"typ":"step_down","start_m":803,"laenge_m":8,"hoehenversatz_m":0.9,"notiz":"Nutzt die Gelaendekante 13 m hinter der Table-Landung; der Versatz ist auf 0,9 m begrenzt, damit die Stufe auch langsam abgerollt regelkonform bleibt, und der Schlusstable 13 m weiter noch vor der Traverse Platz hat."},{"typ":"tabletop","start_m":824,"laenge_m":8,"hoehe_m":1.8,"breite_m":5.5,"notiz":"Faengt den Versatz des Step-downs 13 m hinter dessen Landung auf und schliesst die Gruppe, bevor die Trasse ab 832 m in die 18-Prozent-Traverse abfaellt."},{"typ":"kicker","start_m":980,"laenge_m":21,"absprunghoehe_m":1.8,"gapweite_m":9.5,"grubentiefe_m":1,"notiz":"Erster Sprung nach 148 m Erholungstraverse, auf dem flachsten Stueck des unteren Mittelteils, das hier als einziges eine 1,0 m tiefe Grube traegt; sein Fussabdruck endet bei 1001 m, 13 m vor dem naechsten Table."},{"typ":"tabletop","start_m":1014,"laenge_m":9,"hoehe_m":2,"breite_m":6,"notiz":"Liegt 13 m hinter der Kicker-Landung und traegt die Linie weiter zum letzten Table der Sektion, hinter dem ab 1075 m die Steilstufe ansetzt."},{"typ":"tabletop","start_m":1036,"laenge_m":8,"hoehe_m":1.9,"breite_m":6,"notiz":"Beendet die Sektion 13 m hinter dem vorigen Table, weil 31 m weiter unten die Steilstufe beginnt und auf ihrer Kante kein Absprung mehr stehen kann."},{"typ":"steilstueck","start_m":1075,"laenge_m":70,"gefaelle_prozent":30,"notiz":"Setzt 31 m hinter dem letzten Table an der markanten Steilstufe an und erzeugt den Speed fuer die Schluesselsektion, die 35 m unter seinem Ende beginnt."},{"typ":"tabletop","start_m":1180,"laenge_m":8,"hoehe_m":1.8,"breite_m":6,"notiz":"Vorspann der Schluesselsektion, 35 m unter dem Steilstueck und auf 1,8 m gesenkt, damit er bei der hier real ankommenden Geschwindigkeit sauber geraeumt wird, bevor 13 m weiter der grosse Gap kommt."},{"typ":"kicker","start_m":1201,"laenge_m":25,"absprunghoehe_m":2.3,"gapweite_m":12,"grubentiefe_m":1.2,"notiz":"Groesster Sprung der Strecke bei 63 Prozent der Laenge, 13 m hinter dem Kalibrier-Table; der Fussabdruck aus 8,6 m Rampe, 12 m Gap und 4,4 m Landung endet bei 1226 m, sodass der Table bei 1239 m erst 13 m hinter der Landung beginnt."},{"typ":"tabletop","start_m":1239,"laenge_m":8,"hoehe_m":2.2,"breite_m":6,"notiz":"Faengt den Fahrer 13 m nach dem grossen Gap wieder ein und schliesst als hoechster Table die Schluesselsektion, bevor ab 1247 m die sprungfreie Anlieger-Wallride-Kombination uebernimmt."},{"typ":"anlieger","start_m":1270,"laenge_m":26,"richtung":"links","neigung_grad":38,"hoehe_m":1.7,"breite_m":4,"notiz":"Steht 23 m hinter dem letzten Table der Schluesselsektion, ist dafuer auf 4 m verbreitert und legt den Fahrer in dieselbe Linkskurve, die die Holzwand 16 m dahinter verlangt."},{"typ":"wallride","start_m":1312,"laenge_m":22,"seite":"links","hoehe_m":3,"neigung_grad":76,"material":"holz","notiz":"Zweite und letzte Holzwand, 1125 m unter der ersten, an der linken Hangkante ueber dem Schlussgraben: angefahren aus dem Linksanlieger, der 16 m davor endet, verlassen ueber die Ausleitung ab 1340 m."},{"typ":"anlieger","start_m":1340,"laenge_m":26,"richtung":"rechts","neigung_grad":32,"hoehe_m":1.4,"breite_m":3.6,"notiz":"Ausleitung der Wand sechs Meter hinter deren Ende: dreht die Linie aus dem Wandauslauf zurueck in die Falllinie und uebergibt sie 29 m weiter an die kleine Sprunggruppe ab 1395 m."},{"typ":"tabletop","start_m":1395,"laenge_m":6,"hoehe_m":1.4,"breite_m":5,"notiz":"Eroeffnet die Gruppe 29 m hinter der Wallride-Ausleitung und ist bewusst nur 1,4 m hoch, weil aus dem 32-Grad-Auslauf davor nur rund 30 km/h ankommen."},{"typ":"tabletop","start_m":1414,"laenge_m":7,"hoehe_m":1.6,"breite_m":5.5,"notiz":"Liegt 13 m hinter dem Eroeffnungstable und nutzt das auf dem Absatz wieder aufgebaute Tempo, bevor 13 m weiter der letzte Table der Gruppe folgt."},{"typ":"tabletop","start_m":1434,"laenge_m":7,"hoehe_m":1.5,"breite_m":5.5,"notiz":"Schliesst die Gruppe 13 m hinter dem vorigen Table, weil 39 m weiter unten der letzte Steilhang der Strecke ansetzt und dort kein Absprung mehr stehen kann."},{"typ":"steilstueck","start_m":1480,"laenge_m":70,"gefaelle_prozent":26,"notiz":"Letzter Steilhang, 39 m hinter der kleinen Sprunggruppe an der Gelaendestufe angesetzt; 39 m unter seinem Ende beginnt die Schlusssektion, sodass der aufgebaute Speed bis dahin wieder abgebaut ist."},{"typ":"tabletop","start_m":1589,"laenge_m":8,"hoehe_m":1.8,"breite_m":5.5,"notiz":"Eroeffnet die Schlusssektion 39 m unter dem letzten Steilhang auf dem 9-Prozent-Absatz und uebergibt 13 m weiter an den Abschlusskicker."},{"typ":"kicker","start_m":1610,"laenge_m":16,"absprunghoehe_m":1.3,"gapweite_m":6.5,"grubentiefe_m":0.5,"notiz":"Sitzt 13 m hinter der Table-Landung und hat ein auf 6,5 m verkuerztes Gap, weil der Anlauf hier nur noch aus dem flachen Absatz und nicht mehr aus dem Steilhang kommt; sein Fussabdruck endet 13 m vor dem Schlusstable."},{"typ":"tabletop","start_m":1639,"laenge_m":8,"hoehe_m":1.7,"breite_m":5.5,"notiz":"Letztes Sprungelement der Strecke, 13 m hinter der Kicker-Landung; danach folgen 133 m Erholung bis zum sprung- und wandfreien Schlussdrittel ab 1780 m."},{"typ":"steinfeld","start_m":1743,"laenge_m":32,"notiz":"Technische Schlussstelle 43 m hinter dem letzten Table und noch vor dem Zielanlieger, damit die Steine mit abgebautem Tempo und nicht aus einer Kurve heraus genommen werden; auf 1743 m geschoben, damit zwischen seinem Ende und dem Schlussanlieger bei 1790 m nur 15 m liegen - Bremsen im Steinfeld kostet damit genau das Tempo, das der letzte Anlieger braucht."},{"typ":"anlieger","start_m":1790,"laenge_m":40,"richtung":"links","neigung_grad":30,"hoehe_m":1.5,"breite_m":4.5,"notiz":"Letzter Anlieger, 68 m hinter dem Steinfeld und in den sprung- und wandfreien letzten 120 m, stellt den Fahrer aus der Steinpassage sauber auf die Zielgerade zur Talstation."}]},{"key":"alpin","name":"Alpin","laenge_m":1900,"hoehendifferenz_m":300,"begruendung":"DEFINITION VORAB (loest den Kern von 12 Befunden): Abstand zwischen Sprungelementen wird jetzt einheitlich ab LANDEPUNKT gemessen, Landepunkt = start_m + laenge_m, beim kicker zusaetzlich + gapweite_m. Alle Sektionsabstaende und alle Erholungsfenster sind nach dieser Definition neu vermessen; alle Zahlen in den Notizen sind ab Landepunkt gerechnet. Damit sind die Befunde zu idx9, 15, 20, 24 (Auslauf zu kurz), zu idx24 (Landung 1167 lag 1 m hinter dem Step-down-Beginn 1166) und (b) aus dem Plankonsistenz-Befund erledigt: jeder Folgesprung steht 11-14 m HINTER dem Landepunkt des Vorgaengers, nicht hinter dem Rampenende.\n\nBALLISTIK: Bemessung nach R = v^2*sin(30 Grad)/g = v^2/19,62 (15 Grad Absprung), Zielwert gapweite ~ R. (1) idx5, Kicker 412 m: Anfahrt ~14 m/s (32 m Bremsweg hinter der Steilstufe 300-360), R = 10,0 m, Gap von 6 auf 10 m und Grube auf 0,9 m vergroessert - Ueberschuss weg. (2) idx4, erstes Tabletop: auf die maximal erlaubten 9 m Laenge gezogen und von 380 auf 392 m verschoben, R = 8,6 m bei 13 m/s, Landung damit auf dem Landehang statt 5 m dahinter. (3) idx14, Kicker 778 m: Gap 9 auf 7 m, dazu Steinfeld davor 60 auf 45 m gekuerzt und Anlieger von 40 auf 32 Grad abgeflacht - Anfahrt jetzt ~12 m/s, R = 7,3 m, kein Casing. (4) idx19, Kicker 980 m: Sektionsstart von 940 auf 962 m verlegt, davor 52 m Traverse hinter dem Anlieger, ~12,5 m/s, Gap 8 statt 10 m, R = 8,0 m. (5) idx22, groesster Kicker: 35 m echte Bremszone zwischen Steilstufenauslauf (1110 m) und Absprung (1145 m) statt bisher Table-auf-Steilstufe; Eintritt ~15,3 m/s, R = 11,9 m gegen 12 m Gap - Landung auf dem Landehang statt 4 m dahinter. (6) idx26, Kicker 1358 m: Sektionseinstieg 38 m nach dem Auslauf der steilsten Passage (Ende 1320 m) statt 15 m, und Gap von 8 auf 10 m vergroessert; Anfahrt ~14 m/s, R = 10,0 m. Die physikalisch invertierte Notiz (\"kleiner bauen, weil schnell\") ist ersetzt durch die richtige Begruendung (weiter bauen, weil schnell).\n\nTABLE-RAEUMBARKEIT: idx13 (760 m) auf 7 m/1,4 m verkleinert UND Sektionsstart um 30 m nach unten verlegt (45 m Traverse hinter dem Anlieger, ~12 m/s, R = 7,3 m > 7 m Laenge). idx18 (962 m) ebenso auf 7 m/1,4 m und mit 52 m Anlauf (Forderung: mindestens 55 m Anlauf ODER verkleinern - beides umgesetzt, deshalb reicht der etwas kuerzere Anlauf). Alle uebrigen Tables sind gegen die lokale Geschwindigkeit gerechnet: 392 m 9 m/13 m/s, 590 m 8 m/12,5 m/s, 1181 m 9 m/13,5 m/s, 1390 m 8 m/13 m/s, 1600 m 8 m/12,5 m/s.\n\nREGEL 6: idx18 von hoehe_m 2,0 auf 1,4 reduziert. Damit liegt jedes Groessenmass im Fenster 1140-1330 m (60-70 %): groesste gapweite_m 12 m bei 1145 m (60,3 %), groesste absprunghoehe_m 2,3 m ebenfalls bei 1145 m, groesstes hoehe_m aller Sprungelemente 1,8 m beim Tabletop 1181 m (62,2 %). Kein Sprungelement ausserhalb des Fensters erreicht 1,8 m. Zusaetzlich wurde der Schluesselsprung wie empfohlen von 1145 m als reiner 60,0-%-Grenzfall abgesichert: er liegt jetzt sauber ueber der Grenze (1140 m) und der zweitgroesste Sprung der Strecke steht 36 m dahinter, nicht davor.\n\nREGEL 4 (Kernumbau des Schlussteils): sieben Sektionen mit je drei Sprungelementen und Erholungen von 110 / 142 / 147 / 135 / 145 / 150 / 149 m - alle im Fenster 80-150 m, alle ab Landepunkt gemessen. Die siebte Sektion (1570-1631 m) fuellt genau die vom Pruefer benannte Totstrecke: nach dem letzten Sprung bleiben 149 m bis zum Beginn des pflichtgemaess sprungfreien Schlussabschnitts bei 1780 m, statt bisher 428 m. Innenabstaende der Sektionen 11-14 m, alle unter 15 m. Auch die 151-m-Erholung aus Befund (c) ist weg: 618 -> 760 m sind jetzt 142 m.\n\nREGEL 9: Alle 34 Notizen sind auf Ortsbezug umgeschrieben und mit nachrechenbaren Zahlen versehen. idx4 traegt jetzt den realen Ortsgrund (32 m hinter dem Steilstufenauslauf, erster flacher Absatz mit Landeraum) statt der widerlegten Steigerungs-Behauptung - zusaetzlich steigert die erste Sektion nun auch numerisch tatsaechlich (Table 1,4 / Kicker 1,5 bei 10 m Gap / Step-up 1,6). Die 12-Meter-Angabe bei idx11 ist korrigiert: der Step-down endet bei 618 m, das Steinfeld beginnt bei 632 m, also exakt 14 m. Beim groessten Kicker steht die Position vorn und die Statistik ist gestrichen. Beim hohen Erdanlieger ist die Rechtfertigung eines nicht gebauten Bauteils entfernt; die Wallride-Ersatzargumentation steht hier in der begruendung, wohin sie gehoert.\n\nANLIEGER-PHYSIK UND KORRIDOR: Die drei Steinfeld-Anlieger (185, 695, 890 m) sind auf 32 Grad, 1,2 m Hoehe und 20 m Bogen gesetzt: neutrale Geschwindigkeit v = sqrt(r*g*tan32) mit r ~ 12,7 m ergibt 8,8 m/s gegen einen Eintritt von 7-8 m/s nach 17-18 m Beschleunigungsstrecke hinter dem jeweils auf 45 m gekuerzten Blockwerk - vorher standen 40-42 Grad gegen 5-6 m/s Eintritt. Korridor: Bankprojektion 1,2/tan32 = 1,92 m, bei 4,5 m Bauteilbreite bleiben 2,58 m freier Korridor, also ueber dem Mindestmass 2,5 m; die alpine Trailbreite von 2,5-4 m bezieht sich auf diesen Korridor, die 4,5 m sind die Bauteilbreite inklusive Bankflaeche.\n\nHOHER ERDANLIEGER (Wallride-Ersatz, Befund idx30): Die Vorgabe des Auftraggebers (hoehe_m nahe 1,8, neigung nahe 45) und der Pruefbefund werden ueber die vom Pruefer selbst genannte zweite Option geloest - Beschleunigungsstrecke statt Abflachung. Der Ersatzanlieger steht jetzt nicht mehr direkt am Steinfeldausgang, sondern 80 m dahinter im Schlussgefaelle (Steinfeld endet 1710 m, Anlieger 1790 m) und ist mit 22 m Bogen (r ~ 14,0 m) statt 30 m gebaut. Gegenrechnung: v_neutral = sqrt(14,0 * 9,81 * tan44) = 11,5 m/s; Eintritt aus 6 m/s Steinfeldaustritt plus 80 m Beschleunigung bei 11 % Gefaelle ergibt 11-13 m/s. Die Wand wird also ausgefahren statt in der unteren Haelfte befahren. Korridor: 1,75/tan44 = 1,81 m Projektion, 4,5 - 1,81 = 2,69 m frei. Er ist zugleich der von Regel 7 geforderte letzte Anlieger und liegt vollstaendig im sprungfreien Schlussabschnitt.\n\nROLLER: statt 4 Wellen auf 34 m (8,5 m Abstand) jetzt 5 Wellen auf 21 m (5,25 m Abstand, 0,8 m Hoehe) - pumpbar bei den dort anliegenden 9-10 m/s. Die falsche Behauptung, die Rollerpassage halte das Tempo bis 560 m, ist ersetzt: die Notiz benennt jetzt die anschliessende Traverse als eigentlichen Tempotraeger.\n\nZIELZEIT: Blockwerk von 325 m auf 185 m reduziert (45/45/45/50 statt 45/60/70/70/80), also 140 m heraus statt der geforderten rund 100 m. Ehrliche Neurechnung mit denselben Segmentgeschwindigkeiten wie im Pruefbericht: rund 190 s, also 3:10 - diese Zeit wird als Zielzeit ausgewiesen, die 3:00 werden nicht mehr behauptet.\n\nZWEI BEFUNDE BLEIBEN BEWUSST UNVERAENDERT, MIT GEGENRECHNUNG: (1) \"breite_m fehlt bei Kickern, Step-ups, Step-downs, Hip, Drop, Roller und Steinfeldern\": Die Spezifikation listet breite_m ausschliesslich bei anlieger, wallride und tabletop. Ein breite_m an einem kicker waere ein erfundenes Feld und damit ein Verstoss gegen \"ERLAUBTE TYPEN UND FELDER\" - die Behebung wuerde einen neuen Fehler erzeugen. Ersatzweise ist die Breite dort verankert, wo das Schema sie zulaesst: alle sieben Tabletops sind einheitlich auf 4,5 m gesetzt (Befund idx27, 3,8 m, damit erledigt), und da jede Sektion mindestens ein Tabletop enthaelt, ist die Jumpline-Breite fuer jede Sektion belegt und ueberprueft. Fuer die Steinfelder gilt die Rahmenvorgabe \"2,5 m im technischen Gelaende\" unveraendert; ein Zahlenfeld dafuer existiert im Schema nicht. (2) drop bei 1010 m mit laenge_m 0: Der Pruefer nennt die Spezifikation an dieser Stelle selbst widerspruechlich. Die STRUKTUR-Regel verlangt die Ueberlappungsrechnung start_m[i] + laenge_m[i] <= start_m[i+1] und schreibt ausdruecklich \"ein drop hat laenge_m 0\". Ohne das Feld waere die Rechnung fuer dieses Element undefiniert; der Wert 0 veraendert weder Sortierung noch Ueberlappung. Das Feld bleibt daher mit Wert 0.\n\nSELBSTPRUEFUNG NACH DER KORREKTUR: 34 Elemente (Fenster 24-34). Streng aufsteigend, keine Ueberlappung - die engsten Stellen sind 1010 (drop, Laenge 0) vor 1020, 1204+9 = 1213 vor 1240 und 1790+22 = 1812 vor Ziel 1900. Regel 3: erstes Sprungelement bei 392 m, die ersten 150 m enthalten nur Steilstufe und Steinfeld. Regel 5: alle vier Steinfelder (122, 632, 828, 1660 m) liegen vor einem Anlieger (185, 695, 890, 1790 m), keines dahinter. Regel 7: zwischen 1780 und 1900 m steht ausschliesslich der Zielanlieger, das letzte Sprungelement endet bei 1631 m. Regel 8: alle vier Steilstufen leiten ein - 115 m -> Steinfeld 122 m (7 m), 360 m -> Sektion 392 m (32 m), 1110 m -> Sektion 1145 m (35 m), 1320 m -> Sektion 1358 m (38 m), alle unter 40 m. Regeln 1 und 2 entfallen mangels Wallride. Masse: Tabletops 7-9 m / 1,4-1,8 m, Roller 0,8 m, Step-ups 8 m, Drop 0,85 m, Anlieger 1,2-1,75 m bei 32-44 Grad, Kicker 1,4-2,3 m Absprung, 7-12 m Gap, 0,8-1,3 m Grube - alle innerhalb der verbindlichen Masse. Hoehenprofil: 19 Stuetzstellen, streng monoton fallend von 300,0 auf 0,0 m, Summe der Steilstufen 100,5 hm, Rest 199,5 hm auf 1600 m Traversen (8-15 %). Die Begruendung nennt jetzt korrekt vier Steinfelder (Befund (a)).","hoehenprofil":[{"s_m":0,"hoehe_m":300.0},{"s_m":45,"hoehe_m":296.4},{"s_m":115,"hoehe_m":272.6},{"s_m":300,"hoehe_m":248.6},{"s_m":360,"hoehe_m":228.8},{"s_m":400,"hoehe_m":226.0},{"s_m":450,"hoehe_m":218.0},{"s_m":560,"hoehe_m":202.6},{"s_m":760,"hoehe_m":174.6},{"s_m":962,"hoehe_m":146.3},{"s_m":1020,"hoehe_m":139.3},{"s_m":1110,"hoehe_m":109.6},{"s_m":1160,"hoehe_m":106.1},{"s_m":1240,"hoehe_m":94.1},{"s_m":1320,"hoehe_m":66.9},{"s_m":1400,"hoehe_m":60.5},{"s_m":1570,"hoehe_m":35.0},{"s_m":1790,"hoehe_m":9.9},{"s_m":1900,"hoehe_m":0.0}],"elemente":[{"typ":"steilstueck","start_m":45,"laenge_m":70,"gefaelle_prozent":34,"notiz":"Setzt 45 m nach dem Start auf der ersten Gela     masse:113,       // ca. 25 kg mehr: Motor, Akku, verstärkter Rahmen
    CdA:0.50,
    Crr:0.019,       // breitere Reifen, mehr Auflagedruck
    bremse:8600,     // stärkere Bremsen, aber mehr Masse zu verzögern
    tritt:260,
    motor:620,       // W Motorunterstützung, nur unter 25 km/h (StVZO-Grenze)
    motorBis:6.94,   // 25 km/h in m/s
    luft:3.6,        // träger in der Luft
    boden:7.4,
    grip:1.10,       // mehr Auflagedruck → etwas mehr Grip
    d:'25 kg schwerer, schiebt bis 25 km/h mit. Träge in der Luft, stabiler am Boden.'
  }
};

/* ===========================================================================
   1. MITTELLINIE
   Die Strecke wird nicht gezeichnet, sondern integriert. Anlieger und Wallrides
   biegen die Linie; ihr Radius folgt aus der Querneigung:
        R = v² / (g · tan φ)
   Ein 45°-Anlieger zieht damit fast doppelt so eng wie ein 30°-Anlieger.

   RICHTUNGSKONVENTION (wichtig, weil leicht falsch herum):
   `richtung` bzw. `seite` ist immer die KURVENRICHTUNG, nicht die Bauseite.
   Die Bank steht auf der Kurvenaußenseite — bei einer Linkskurve also rechts.
   Das gilt für Anlieger und Wallride gleichermaßen, deshalb ist Regel 1
   ("Anlieger in dieselbe Richtung") physikalisch stimmig.
   =========================================================================== */
const DS = 1.5;    // Stationsabstand, m

function aussenVon(richtung){ return richtung === 'links' ? 1 : -1; }  // +1 = außen rechts

/* Grobes Tempoprofil aus dem Höhenprofil allein, ohne Kurven und ohne Bremsen.
   Es wird gebraucht, BEVOR die Kurven feststehen — deshalb dieser erste Durchgang.
   Ein Anlieger, dessen Radius aus einer festen Referenzgeschwindigkeit kommt, ist
   bei echten 18-20 m/s drei- bis viermal zu eng; der Fahrer wird oben rausgetragen. */
function tempoProfil(track){
  const L = track.laenge_m, SCHRITT = 2.0;
  const n = Math.ceil(L/SCHRITT) + 2, v = new Float32Array(n);
  const m = 88, CdA = 0.48, rho = 1.225;
  v[0] = 3;
  for(let i = 1; i < n; i++){
    const s = i*SCHRITT;
    const dh = baseHoehe(track, s-SCHRITT) - baseHoehe(track, s);
    const theta = Math.atan(dh/SCHRITT);
    let crr = 0.016;
    for(const e of track.elemente){
      if(e.typ === 'steinfeld' && s >= e.start_m && s <= e.start_m+e.laenge_m) crr *= 3.4;
    }
    const vv = Math.max(v[i-1], 2);
    const a = G*Math.sin(theta) - G*Math.cos(theta)*crr - 0.5*rho*CdA*vv*vv/m;
    v[i] = Math.max(2.5, Math.min(28, Math.sqrt(Math.max(6.25, vv*vv + 2*a*SCHRITT))));
  }
  return s => v[Math.max(0, Math.min(Math.round(s/SCHRITT), n-1))];
}

function baueMittellinie(track){
  const L = track.laenge_m;
  const vBei = tempoProfil(track);
  const kurven = [];
  for(const e of track.elemente){
    if(e.typ === 'anlieger'){
      // Radius aus dem Tempo an DIESER Stelle, nicht aus einer Konstanten.
      const v = vBei(e.start_m + e.laenge_m/2);
      const R = Math.max(10, Math.min(65, v*v / (G * Math.tan(e.neigung_grad * Math.PI/180))));
      kurven.push({a:e.start_m, b:e.start_m+e.laenge_m, k:(e.richtung==='links'?1:-1)/R});
    } else if(e.typ === 'wallride'){
      const v = vBei(e.start_m + e.laenge_m/2);
      const R = Math.max(14, Math.min(45, v*v / (G * Math.tan(52 * Math.PI/180))));
      kurven.push({a:e.start_m, b:e.start_m+e.laenge_m, k:(e.seite==='links'?1:-1)/R});
    }
  }
  const st = [];
  let psi = 0, x = 0, z = 0;
  for(let s = 0; s <= L + DS; s += DS){
    let k = 0;
    for(const c of kurven) if(s >= c.a && s < c.b) k += c.k;
    if(k === 0) k = 0.0016*Math.sin(s/61) + 0.0011*Math.sin(s/137 + 2);  // leichte Drift
    psi += k*DS; x += Math.sin(psi)*DS; z += Math.cos(psi)*DS;
    st.push({s, x, z, psi, k});
  }
  return st;
}

/* --------------------------------------------------------- Basis-Höhenprofil */
function baseHoehe(track, s){
  const hp = track.hoehenprofil;
  // Fehlt das Profil, bleibt ein gleichmäßiges Gefälle. Lieber eine fahrbare
  // Strecke als eine leere Seite.
  if(!hp || hp.length < 2) return track.hoehendifferenz_m * (1 - s/track.laenge_m);
  if(s <= hp[0].s_m) return hp[0].hoehe_m;
  if(s >= hp[hp.length-1].s_m) return hp[hp.length-1].hoehe_m;
  for(let i = 0; i < hp.length-1; i++){
    const a = hp[i], b = hp[i+1];
    if(s >= a.s_m && s <= b.s_m){
      const t = (s-a.s_m)/(b.s_m-a.s_m);
      const e = t*t*(3-2*t);                    // sanfter Übergang statt Knick
      return a.hoehe_m + e*(b.hoehe_m-a.hoehe_m);
    }
  }
  return 0;
}

/* Deterministisches Rauschen — dieselbe Strecke sieht immer gleich aus. */
function noise(x){
  const i = Math.floor(x), f = x - i;
  const h = n => { const t = Math.sin(n*127.1)*43758.5453; return t - Math.floor(t); };
  const u = f*f*(3-2*f);
  return (h(i)*(1-u) + h(i+1)*u)*2 - 1;
}

/* ===========================================================================
   2. LÄNGSPROFIL DER ELEMENTE  —  Δh(s)
   Jedes Sprungelement verformt die Höhe entlang der Strecke. Der Basisverlauf
   aus `hoehenprofil` bleibt unangetastet, die Elemente liegen additiv darauf.
   =========================================================================== */
function rampe(q){ return q*q*(3-2*q); }                    // 0→1, an beiden Enden flach
function bucht(q){ return Math.sin(Math.PI*q); }            // 0→1→0

function deltaH(track, s){
  let d = 0;
  for(const e of track.elemente){
    const a = e.start_m, len = e.laenge_m || 0, b = a + len;
    switch(e.typ){

      case 'tabletop': {
        if(s < a || s > b) break;
        const q = (s-a)/len;
        // 38 % Anfahrtsrampe, 26 % flaches Dach, 36 % Landung
        if(q < 0.38)      d += e.hoehe_m * rampe(q/0.38);
        else if(q < 0.64) d += e.hoehe_m;
        else              d += e.hoehe_m * (1 - rampe((q-0.64)/0.36));
        break;
      }

      case 'kicker': {
        // Absprungrampe → Grube über die Gapweite → Landehügel
        const rampL = Math.max(len - e.gapweite_m, 2.5);
        if(s >= a && s < a + rampL){
          d += e.absprunghoehe_m * rampe((s-a)/rampL);
        } else if(s >= a + rampL && s < b){
          const q = (s - a - rampL) / Math.max(e.gapweite_m, 0.5);
          // Grube direkt hinter der Lippe, Landung steigt wieder an
          d += -e.grubentiefe_m * bucht(Math.min(q*1.15, 1))
               + e.absprunghoehe_m * 0.55 * Math.max(0, q-0.55)/0.45;
        }
        break;
      }

      case 'step_up': {
        // Landung liegt höher als der Absprung; das Gelände holt den Versatz
        // über die nächsten 18 m wieder auf.
        if(s < a) break;
        if(s <= b)          d += e.hoehenversatz_m * rampe((s-a)/len);
        else if(s < b + 18) d += e.hoehenversatz_m * (1 - rampe((s-b)/18));
        break;
      }

      case 'step_down': {
        if(s < a) break;
        if(s <= b)          d += -e.hoehenversatz_m * rampe((s-a)/len);
        else if(s < b + 22) d += -e.hoehenversatz_m * (1 - rampe((s-b)/22));
        break;
      }

      case 'drop': {
        // Der Absatz ist bewusst NICHT senkrecht: bei exakt 0 m Lauflänge
        // entstehen entartete Dreiecke und der Raycast findet an der Kante
        // zwei Treffer. 0,35 m sind bei 1,5 m Stationsabstand schmal genug,
        // dass es sich wie eine Kante fährt, und breit genug für sauberes Mesh.
        const KANTE = 0.35;
        if(s < a - 2.2) break;
        if(s < a){                       // kurze Lippe: leicht ansteigend
          d += e.hoehe_m * 0.14 * rampe((s-(a-2.2))/2.2);
        } else if(s < a + KANTE){
          const q = (s-a)/KANTE;
          d += e.hoehe_m * (0.14 - 1.14*q);
        } else if(s < a + KANTE + 14){
          d += -e.hoehe_m * (1 - rampe((s-a-KANTE)/14));
        }
        break;
      }

      case 'hip': {
        if(s < a || s > b) break;
        const q = (s-a)/len;
        d += e.hoehe_m * (q < 0.55 ? rampe(q/0.55) : 1 - rampe((q-0.55)/0.45));
        break;
      }

      case 'roller': {
        if(s < a || s > b) break;
        const q = (s-a)/len;
        // Ein- und Ausblenden, damit die Kette nicht mit einer Kante beginnt
        const hull = Math.min(1, Math.min(q, 1-q)*6);
        d += e.hoehe_m * 0.5 * hull * (1 - Math.cos(2*Math.PI*e.anzahl*q));
        break;
      }

      case 'steinfeld': {
        if(s < a || s > b) break;
        const hull = Math.min(1, Math.min(s-a, b-s)/3);
        d += 0.16 * hull * (noise(s*2.6) + 0.5*noise(s*6.1));
        break;
      }
    }
  }
  return d;
}

/* ===========================================================================
   3. QUERSCHNITT  —  das eigentliche Kernstück

   Ein einzelner Zahlenwert „Querneigung" reicht für einen Anlieger, aber NICHT
   für einen Wallride. Bei 80° Querneigung über die ganze Breite gäbe es keine
   Fahrfläche mehr, auf der man ankommt und zurückkommt — der Fahrer müsste die
   Wand permanent mit Kurvenkraft halten.

   Ein echter Wallride ist stattdessen: Trailboden + aufsteigende Seitenwand.
   Die Neigung ist also keine Zahl pro Station, sondern eine FUNKTION der
   Querposition:  v(x),  x = 0 in der Mitte, positiv nach kurvenaußen.

   Anlieger:  v(x) = h · (x−kante)/run  hoch p      (konkav, steilste Stelle oben)
   Wallride:  Boden bis zur Kante, dann dieselbe Potenzkurve, aber mit
              run = h/tan φ — bei h = 3 m und φ = 80° sind das nur 0,53 m
              Grundfläche für 3 m Höhe.

   Der Exponent p ist so gewählt, dass die Neigung an der Oberkante exakt φ ist:
        p = 1 + fillet · tan φ / h
   =========================================================================== */
const FILLET = 1.15;    // Radius, mit dem der Boden in die Wand übergeht, m

function querschnittBei(track, s){
  // Liefert die Beschreibung des Querschnitts an Station s.
  let breite = 4.2, bank = 0, aussen = 1, wandH = 0, wandPhi = 0, material = 'holz';
  let staerkste = 0;   // stärkster Bank-Einfluss an dieser Station

  for(const e of track.elemente){
    const a = e.start_m, len = e.laenge_m || 0, b = a + len;

    if(e.typ === 'anlieger'){
      // 8 m Ein- und Ausleitung, damit die Bank nicht springt
      const bl = Math.min(1, Math.min((s-(a-8))/8, (b+8-s)/8));
      if(bl > 0){
        const w = Math.max(0, Math.min(1, bl));
        const b = w * e.neigung_grad * Math.PI/180;
        breite = Math.max(breite, e.breite_m);
        if(b > staerkste){ staerkste = b; aussen = aussenVon(e.richtung); bank = b; }
      }
    }

    if(e.typ === 'wallride'){
      const bl = Math.min(1, Math.min((s-(a-7))/7, (b+7-s)/7));
      if(bl > 0){
        const w = Math.max(0, Math.min(1, bl));
        // Der Wallride bestimmt die Außenseite immer: die Wand steht fest gebaut da.
        aussen  = aussenVon(e.seite);
        wandH   = Math.max(wandH, w * e.hoehe_m);
        wandPhi = e.neigung_grad * Math.PI/180;
        material = e.material;
        bank    = w * 14 * Math.PI/180;   // Boden leicht zur Wand geneigt
        staerkste = 99;
      }
    }

    if(e.typ === 'tabletop' || e.typ === 'kicker' || e.typ === 'hip'){
      if(s >= a-6 && s <= b+6) breite = Math.max(breite, e.breite_m || 5.0);
    }
    if(e.typ === 'steinfeld' && s >= a && s <= b) breite = Math.min(breite, 3.2);
  }
  return {breite, bank, aussen, wandH, wandPhi, material};
}

/* Höhe der Fahrfläche über der Mittellinie, an Querposition u (m, rechts +). */
function querV(qs, u){
  const x = u * qs.aussen;                 // x > 0 = kurvenaußen
  const halb = qs.breite/2;
  const h = qs.wandH > 0.05 ? qs.wandH : 0;
  const kante = halb - FILLET;

  // Grundneigung des BODENS. Ab dem Wandfuß hört sie auf — sonst addiert sie
  // sich auf die Wandhöhe drauf und die Wand wird höher als deklariert.
  const bodenBis = h > 0.05 ? kante : halb;
  let v = Math.max(0, Math.min(x, bodenBis) + halb) * Math.tan(Math.min(qs.bank, 0.30));

  // Wandkurve ab der Kante nach außen. Der Exponent ist so gewählt, dass die
  // Neigung an der Oberkante genau φ ist und v dort genau h erreicht.
  if(h > 0.05 && x > kante){
    const W = FILLET + h / Math.tan(qs.wandPhi);
    const p = 1 + FILLET * Math.tan(qs.wandPhi) / h;
    v += h * Math.pow(Math.min((x-kante)/W, 1), p);
  }
  return v;
}

/* Wie weit nach kurvenaußen reicht der Querschnitt? (Wand steht außerhalb der Trailbreite) */
function aussenGrenze(qs){
  const halb = qs.breite/2;
  if(qs.wandH <= 0.05) return halb;
  return halb - FILLET + (FILLET + qs.wandH/Math.tan(qs.wandPhi));
}

/* ===========================================================================
   4. MESH
   Der Querschnitt wird NACH BOGENLÄNGE abgetastet, nicht nach Querposition.
   Grund: bei 80° Wandneigung liegen 3 m Höhe auf 0,53 m Grundfläche. Eine
   gleichmäßige Abtastung in x würde dort drei Stützpunkte auf die ganze Wand
   legen und den Rest der Punkte auf den flachen Boden verschwenden.
   =========================================================================== */
const N_QUER  = 22;    // Stützpunkte quer über die Fahrfläche
const SKIRT   = [3, 14, 45];        // Entfernung der Geländeschürze vom Trailrand, m
const SKIRT_AB = [1.2, 6.0, 26.0];  // talseits: so tief fällt das Gelände ab, m
const SKIRT_AUF= [1.1, 5.5, 15.0];  // bergseits: so hoch steigt die Anschnittsböschung, m

/* Ein Trail liegt IM Hang, nicht auf einem Rücken: bergseits ein Anschnitt,
   talseits ein Abfall. Welche Seite bergseits ist, folgt aus der Falllinie —
   der Richtung, in die die Strecke insgesamt absteigt. Läuft der Trail gerade
   die Falllinie hinunter, fallen beide Seiten gleich ab; quert er den Hang,
   steigt die eine Seite an. `bergSign` = +1 heißt: rechts ist talseits. */
function profilPunkte(qs, bergSign){
  // 1) fein abtasten
  const innen = -qs.breite/2, aussenX = aussenGrenze(qs);
  const FEIN = 96, roh = [];
  for(let i = 0; i <= FEIN; i++){
    const x = innen + (aussenX - innen) * i/FEIN;
    roh.push({x, v: querV(qs, x * qs.aussen)});
  }
  // 2) Bogenlänge aufsummieren
  const len = [0];
  for(let i = 1; i < roh.length; i++){
    len.push(len[i-1] + Math.hypot(roh[i].x - roh[i-1].x, roh[i].v - roh[i-1].v));
  }
  const gesamt = len[len.length-1] || 1;
  // 3) gleichmäßig nach Bogenlänge neu abtasten
  const pts = [];
  let j = 0;
  for(let i = 0; i < N_QUER; i++){
    const ziel = gesamt * i/(N_QUER-1);
    while(j < len.length-2 && len[j+1] < ziel) j++;
    const seg = len[j+1] - len[j];
    const t = seg > 1e-9 ? (ziel - len[j])/seg : 0;
    pts.push({x: roh[j].x + t*(roh[j+1].x - roh[j].x),
              v: roh[j].v + t*(roh[j+1].v - roh[j].v), trail:true});
  }
  // 4) Geländeschürze anhängen
  const links = [], rechts = [];
  // u = x · aussen, also liegt der Teil mit x < 0 auf der Seite -aussen.
  const versatz = (seiteU, i, kante) => {
    const talig = (seiteU * bergSign + 1) / 2;          // 0 = bergseits, 1 = talseits
    return kante + (SKIRT_AUF[i] * (1 - talig) - SKIRT_AB[i] * talig);
  };
  const sL = -Math.sign(qs.aussen) || -1, sR = Math.sign(qs.aussen) || 1;
  for(let i = SKIRT.length-1; i >= 0; i--){
    const x = innen - SKIRT[i];
    links.push({x, v: versatz(sL, i, pts[0].v) + noise(x*0.6 + qs.breite)*1.5, trail:false});
  }
  const oben = pts[pts.length-1];
  for(let i = 0; i < SKIRT.length; i++){
    const x = aussenX + SKIRT[i];
    rechts.push({x, v: versatz(sR, i, oben.v) + noise(x*0.6 - qs.breite)*1.5, trail:false});
  }
  return links.concat(pts, rechts);
}

const FARBE = {
  trail:  new THREE.Color(0x7b6e62),   // heller als das Gelände: die Linie muss lesbar sein
  rand:   new THREE.Color(0x3b352d),   // Trailrand, damit die Kante sichtbar wird
  bank:   new THREE.Color(0x7d7062),
  holz:   new THREE.Color(0x8a6238),
  beton:  new THREE.Color(0x6a6c72),
  gelaende:new THREE.Color(0x1e2c1d),
  fern:   new THREE.Color(0x18231a),
};

function baueStreckenMesh(track, st, hArr, qsArr, bergBei){
  const cols = N_QUER + 2*SKIRT.length;
  const pos = [], col = [], idx = [];
  const c = new THREE.Color();

  for(let i = 0; i < st.length; i++){
    const s = st[i].s, qs = qsArr[i];
    const cx = st[i].x, cz = st[i].z, cy = hArr(s);
    const rx = -Math.cos(st[i].psi), rz = Math.sin(st[i].psi);   // rechts = vorwärts × oben
    const pts = profilPunkte(qs, bergBei(i));
    const kante = qs.breite/2 - FILLET;

    for(const p of pts){
      const u = p.x * qs.aussen;
      pos.push(cx + rx*u, cy + p.v, cz + rz*u);
      if(!p.trail){
        const tief = Math.min(1, (Math.abs(p.x) - qs.breite/2) / 40);
        c.copy(FARBE.gelaende).lerp(FARBE.fern, tief);
        c.offsetHSL(noise(s*0.31 + p.x)*0.03, 0, noise(s*0.9 + p.x*0.4)*0.045);
      } else if(qs.wandH > 0.3 && p.x > kante){
        // Wandfläche bekommt Material-Farbe, damit man Holz von Beton sieht
        const hoch = Math.min(1, (p.v - querV(qs, kante*qs.aussen)) / Math.max(qs.wandH, .3));
        c.copy(FARBE.trail).lerp(qs.material === 'beton' ? FARBE.beton : FARBE.holz, Math.min(1, hoch*2.2));
        // Waagerechte Bänderung: Bohlen beim Holz, Schalungsfugen beim Beton.
        // Ohne sie sieht die Wand aus wie modellierte Erde, nicht wie gebaut.
        c.offsetHSL(0, 0, Math.sin(p.v * (qs.material === 'beton' ? 4.2 : 9.5)) * 0.055 * hoch);
      } else if(qs.bank > 0.28 && p.x > kante - 0.6){
        c.copy(FARBE.bank);
      } else {
        // Die äußersten beiden Trailspalten werden zum Rand hin dunkler —
        // ohne diese Kante verschwimmt die Fahrfläche mit dem Hang.
        const randNah = Math.max(0, (Math.abs(p.x) - (qs.breite/2 - 0.7)) / 0.7);
        c.copy(FARBE.trail).lerp(FARBE.rand, Math.min(1, randNah));
        c.offsetHSL(0, 0, noise(s*0.7 + p.x*1.9)*0.05);
      }
      col.push(c.r, c.g, c.b);
    }
  }
  for(let i = 0; i < st.length-1; i++){
    for(let j = 0; j < cols-1; j++){
      const a = i*cols + j, b = a + 1, d = a + cols, e = d + 1;
      idx.push(a, d, b, b, d, e);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color',    new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return new THREE.Mesh(g, new THREE.MeshStandardMaterial({
    vertexColors:true, roughness:0.94, metalness:0.0, side:THREE.DoubleSide, flatShading:false
  }));
}

/* ===========================================================================
   5. STRECKE BAUEN — alles einmal vorberechnen
   =========================================================================== */
const H_STEP = 0.25;

function baueStrecke(track){
  const st = baueMittellinie(track);
  const L  = track.laenge_m;

  // Höhenfeld fein vorberechnen: baseHoehe + Δh der Elemente
  const n = Math.ceil(L/H_STEP) + 8, hRaw = new Float32Array(n);
  for(let i = 0; i < n; i++){
    const s = i*H_STEP;
    hRaw[i] = baseHoehe(track, s) + deltaH(track, s);
  }
  const hArr = s => {
    const f = Math.max(0, Math.min(s/H_STEP, n-2));
    const i = Math.floor(f), t = f - i;
    return hRaw[i] + t*(hRaw[i+1] - hRaw[i]);
  };
  const dhds = s => (hArr(s+0.4) - hArr(s-0.4)) / 0.8;

  // Falllinie: grobe Gesamtrichtung des Abstiegs. Daraus folgt pro Station,
  // welche Trailseite bergseits liegt.
  const dx = st[st.length-1].x - st[0].x, dz = st[st.length-1].z - st[0].z;
  const dl = Math.hypot(dx, dz) || 1;
  const fx = dx/dl, fz = dz/dl;
  const bergArr = st.map(p => {
    const rx = -Math.cos(p.psi), rz = Math.sin(p.psi);
    return Math.max(-1, Math.min(1, (rx*fx + rz*fz) * 1.8));
  });
  const bergBei = i => bergArr[Math.max(0, Math.min(i, bergArr.length-1))];
  const bergAt  = s => bergBei(Math.round(s/DS));

  const qsArr = st.map(p => querschnittBei(track, p.s));
  const qsBei = s => qsArr[Math.max(0, Math.min(Math.round(s/DS), qsArr.length-1))];
  const stBei = s => st[Math.max(0, Math.min(Math.round(s/DS), st.length-1))];

  const mesh = baueStreckenMesh(track, st, hArr, qsArr, bergBei);

  // Höhe der Fahrfläche an (s, u) — analytisch, kein Raycast.
  // Das ist stabiler als ein Raycast gegen das Mesh und an der Drop-Kante eindeutig.
  const flaeche = (s, u) => hArr(s) + querV(qsBei(s), u);

  return {track, st, hArr, dhds, qsBei, stBei, mesh, flaeche, L, bergAt};
}

/* ===========================================================================
   6. FAHRPHYSIK
   Punktmasse auf der Fahrfläche. Die Höhe wird IMMER ballistisch integriert und
   danach gegen die Fläche geklemmt — dadurch entsteht der Absprung von selbst:
   auf der Kickerrampe ist vy = dh/ds · vs positiv, hinter der Lippe fällt die
   Fläche weg, und der Fahrer ist in der Luft, ohne dass es dafür Sonderregeln
   braucht.
   =========================================================================== */
const RHO = 1.225;

function neuerFahrer(bike){
  return {bike, s:2, u:0, vs:1.5, vu:0, y:0, vy:0, boden:true, amRand:false,
          luftZeit:0, luftGesamt:0, stuerze:0, zeit:0, roll:0, tilt:0};
}

function schritt(w, f, dt, ein){
  const bike = f.bike, m = bike.masse;
  const qs = w.qsBei(f.s), stn = w.stBei(f.s);
  const halb = qs.breite/2;
  const innenU = -halb * qs.aussen, aussenU = aussenGrenze(qs) * qs.aussen;

  // --- Längsrichtung ---
  const slope = w.dhds(f.s);
  const theta = Math.atan(-slope);                  // > 0 = bergab
  let F = 0;
  const drag = 0.5*RHO*bike.CdA*f.vs*f.vs;
  if(f.boden){
    let crr = bike.Crr;
    // Steinfeld kostet Rollwiderstand — deshalb steht es vor dem Anlieger
    for(const e of w.track.elemente){
      if(e.typ === 'steinfeld' && f.s >= e.start_m && f.s <= e.start_m+e.laenge_m) crr *= 3.4;
    }
    F += m*G*Math.sin(theta);
    F -= m*G*Math.cos(theta)*crr;
    F -= ein.bremse * bike.bremse * 0.16;
    if(ein.gas) F += Math.min(bike.tritt/Math.max(f.vs,1.2), 900);
    if(ein.gas && bike.motor && f.vs < bike.motorBis) F += Math.min(bike.motor/Math.max(f.vs,1.2), 700);
  }
  F -= drag;
  f.vs = Math.max(0.4, f.vs + F/m*dt);

  // --- Querrichtung ---
  const eps = 0.06;
  const dvdu = (querV(qs, f.u+eps) - querV(qs, f.u-eps)) / (2*eps);
  const zentrifugal = stn.k * f.vs * f.vs;          // k > 0 = Linkskurve → Druck nach rechts (+u)
  const hang = -G * dvdu;                           // Fläche steigt nach +u → Zug nach −u
  const steuer = ein.quer * (f.boden ? bike.boden : bike.luft);
  const daempf = (f.boden ? 3.4 : 0.35) * f.vu;
  // Linienhaltung: nur in der Trailmitte und nur ohne Lenkbefehl. Draußen auf
  // der Bank oder der Wand darf sie nicht gegen die Fliehkraft arbeiten.
  const halte = (f.boden && ein.quer === 0 && Math.abs(f.u) < halb*0.6) ? -f.u * 2.4 : 0;
  f.vu += (zentrifugal + hang + steuer + halte - daempf) * dt;
  f.u  += f.vu * dt;

  // --- Höhe ---
  f.vy -= G*dt;
  f.y  += f.vy*dt;
  f.s  += f.vs*dt;

  const flaeche = w.flaeche(f.s, f.u);
  if(f.y <= flaeche){
    const vyFlaeche = w.dhds(f.s)*f.vs + dvdu*f.vu;
    const aufprall = vyFlaeche - f.vy;
    if(!f.boden && aufprall > 2.2){
      // Harte Landung kostet Tempo. Flache Landung auf einem Landehügel kostet fast nichts —
      // deshalb ist die Landung bei Kicker und Tabletop als Rampe gebaut, nicht als Ebene.
      f.vs *= Math.max(0.52, 1 - (aufprall-2.2)*0.038);
    }
    if(!f.boden && f.luftZeit > 0.12) f.luftGesamt += f.luftZeit;
    f.y = flaeche; f.vy = vyFlaeche; f.boden = true; f.luftZeit = 0;
  } else {
    f.boden = false; f.luftZeit += dt;
  }

  // --- Grenzen der Fahrfläche ---
  const lo = Math.min(innenU, aussenU), hi = Math.max(innenU, aussenU);
  const draussen = f.u < lo || f.u > hi;
  if(draussen){
    f.u = Math.max(lo, Math.min(hi, f.u));
    // Nach innen abprallen, damit der Fahrer nicht am Rand klebt
    f.vu = (f.u <= lo ? 1 : -1) * Math.max(1.2, Math.abs(f.vu)*0.35);
    if(!f.amRand){ f.vs *= 0.72; f.stuerze++; }   // Strafe nur beim NEUEN Kontakt
  }
  f.amRand = draussen;

  // Lage für die Darstellung
  const zielRoll = Math.atan(dvdu) + Math.max(-0.5, Math.min(0.5, stn.k*f.vs*f.vs/G*0.35));
  f.roll += (zielRoll - f.roll) * Math.min(1, dt*7);
  f.tilt += (theta - f.tilt) * Math.min(1, dt*5);
  f.zeit += dt;
  return f;
}

/* --------------------------------------------------------------- Bäume */
function baueBaeume(w){
  const N = 900;
  const stammG = new THREE.CylinderGeometry(0.16, 0.26, 3, 5);
  const kroneG = new THREE.ConeGeometry(1.7, 7.5, 7);
  const stamm = new THREE.InstancedMesh(stammG, new THREE.MeshStandardMaterial({color:0x2a2119, roughness:1}), N);
  const krone = new THREE.InstancedMesh(kroneG, new THREE.MeshStandardMaterial({color:0x1c3324, roughness:1, flatShading:true}), N);
  const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), P = new THREE.Vector3(), S = new THREE.Vector3();
  for(let i = 0; i < N; i++){
    const s = (i/N)*w.L;
    const st = w.stBei(s), qs = w.qsBei(s);
    const seite = noise(i*3.7) > 0 ? 1 : -1;
    const ab = qs.breite/2 + 14 + Math.abs(noise(i*1.31))*34;
    const u = seite*ab;
    const rx = -Math.cos(st.psi), rz = Math.sin(st.psi);
    const gr = 0.65 + Math.abs(noise(i*5.9))*0.85;
    // Bäume folgen demselben Hang wie die Schürze: bergseits höher, talseits tiefer
    const ferne = ab - qs.breite/2;
    const talig = (Math.sign(u) * w.bergAt(s) + 1) / 2;
    const y = w.hArr(s) + (1-talig)*Math.min(15, ferne*0.34)
                        - talig*Math.min(30, ferne*0.62) - 0.4;
    P.set(st.x + rx*u, y, st.z + rz*u);
    Q.setFromAxisAngle(new THREE.Vector3(0,1,0), noise(i*2.2)*3.14);
    S.set(gr, gr, gr);
    M.compose(P, Q, S); stamm.setMatrixAt(i, M);
    P.y += 3*gr + 3.4*gr;
    M.compose(P, Q, S); krone.setMatrixAt(i, M);
  }
  stamm.instanceMatrix.needsUpdate = true; krone.instanceMatrix.needsUpdate = true;
  return [stamm, krone];
}

/* ===========================================================================
   8. FAHRZEUGE
   Die GLB-Datei wird geladen, wenn sie neben der HTML liegt. Über ihren INHALT
   wird nichts angenommen: keine Node-Namen, keine Achsenkonvention, keine
   Materialien werden gesucht oder überschrieben. Sie wird nur eingemessen,
   auf 1,80 m Gesamthöhe skaliert und auf den Boden gestellt.
   Fehlt die Datei, baut sich ein Ersatzfahrer aus Primitiven — die Seite läuft
   in jedem Fall.
   =========================================================================== */
const GLB_PFAD  = 'mtb-emtb-fahrerin.glb';
const GLB_DREHUNG = Math.PI;   // ungeprüft: Blickrichtung der GLB unbekannt.
                               // Schaut die Fahrerin rückwärts, hier auf 0 setzen.

function ersatzFahrer(accent){
  const g = new THREE.Group();
  const rahmen = new THREE.MeshStandardMaterial({color:accent, roughness:0.35, metalness:0.55});
  const gummi  = new THREE.MeshStandardMaterial({color:0x14161a, roughness:0.95});
  const stoff  = new THREE.MeshStandardMaterial({color:0x2b3038, roughness:0.85});
  const haut   = new THREE.MeshStandardMaterial({color:0xc99a76, roughness:0.7});

  const radG = new THREE.TorusGeometry(0.35, 0.055, 8, 22);
  for(const z of [0.54, -0.54]){
    const r = new THREE.Mesh(radG, gummi);
    r.rotation.y = Math.PI/2; r.position.set(0, 0.35, z);
    g.add(r);
  }
  const ober = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 0.95), rahmen);
  ober.position.set(0, 0.72, 0.02); g.add(ober);
  const sitz = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.36, 0.08), rahmen);
  sitz.position.set(0, 0.6, -0.36); g.add(sitz);
  const gabel = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.62), rahmen);
  gabel.position.set(0, 0.55, 0.5); gabel.rotation.x = -0.28; g.add(gabel);
  const lenker = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.72), rahmen);
  lenker.position.set(0, 0.95, 0.44); lenker.rotation.z = Math.PI/2; g.add(lenker);

  const rumpf = new THREE.Mesh(new THREE.CapsuleGeometry(0.17, 0.44, 4, 10), stoff);
  rumpf.position.set(0, 1.18, -0.06); rumpf.rotation.x = 0.42; g.add(rumpf);
  const kopf = new THREE.Mesh(new THREE.SphereGeometry(0.125, 12, 10), haut);
  kopf.position.set(0, 1.53, 0.16); g.add(kopf);
  const helm = new THREE.Mesh(new THREE.SphereGeometry(0.145, 12, 10, 0, 6.3, 0, 1.9), rahmen);
  helm.position.set(0, 1.55, 0.15); g.add(helm);
  for(const x of [0.2, -0.2]){
    const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.055, 0.4, 3, 7), stoff);
    arm.position.set(x, 1.12, 0.24); arm.rotation.x = 0.95; g.add(arm);
    const bein = new THREE.Mesh(new THREE.CapsuleGeometry(0.075, 0.36, 3, 7), stoff);
    bein.position.set(x*0.55, 0.72, -0.1); bein.rotation.x = -0.3; g.add(bein);
  }
  return g;
}

function motorTeile(accent){
  // Sichtbarer Unterschied zum MTB, unabhängig davon, was in der GLB steckt:
  // Motorgehäuse am Tretlager und Akku im Unterrohr.
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({color:0x23262b, roughness:0.4, metalness:0.7});
  const led = new THREE.MeshStandardMaterial({color:accent, emissive:accent, emissiveIntensity:1.5, roughness:0.3});
  const motor = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.2, 12), mat);
  motor.rotation.z = Math.PI/2; motor.position.set(0, 0.34, -0.02); g.add(motor);
  const akku = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.13, 0.62), mat);
  akku.position.set(0, 0.55, 0.22); akku.rotation.x = 0.36; g.add(akku);
  const strip = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.015, 0.4), led);
  strip.position.set(0.05, 0.56, 0.22); strip.rotation.x = 0.36; g.add(strip);
  return g;
}

function einmessen(objekt, zielHoehe){
  const box = new THREE.Box3().setFromObject(objekt);
  const gr = new THREE.Vector3(); box.getSize(gr);
  if(!isFinite(gr.y) || gr.y < 1e-4) return objekt;
  const f = zielHoehe / gr.y;
  const wrap = new THREE.Group();
  objekt.scale.setScalar(f);
  objekt.position.set(-(box.min.x + gr.x/2)*f, -box.min.y*f, -(box.min.z + gr.z/2)*f);
  wrap.add(objekt);
  return wrap;
}

async function ladeFahrzeug(bike){
  const halter = new THREE.Group();
  try{
    const gltf = await new Promise((ok, no) =>
      new GLTFLoader().load(GLB_PFAD, ok, undefined, no));
    const modell = einmessen(gltf.scene, 1.80);
    modell.rotation.y = GLB_DREHUNG;
    halter.add(modell);
    halter.userData.quelle = 'glb';
  }catch(e){
    halter.add(ersatzFahrer(bike.accent));
    halter.userData.quelle = 'ersatz';
  }
  if(bike.motor) halter.add(motorTeile(bike.accent));
  return halter;
}

/* --------------------------------------------- Position auf der Mittellinie */
const _p = new THREE.Vector3(), _f = new THREE.Vector3(), _r = new THREE.Vector3();
const _camZiel = new THREE.Vector3(), _camPos = new THREE.Vector3(), _up = new THREE.Vector3();

function stInterp(w, s){
  const f = Math.max(0, Math.min(s/DS, w.st.length - 2));
  const i = Math.floor(f), t = f - i;
  const a = w.st[i], b = w.st[i+1];
  return {x: a.x + t*(b.x-a.x), z: a.z + t*(b.z-a.z), psi: a.psi + t*(b.psi-a.psi)};
}
function weltPos(w, s, u, y, out){
  const st = stInterp(w, s);
  const rx = -Math.cos(st.psi), rz = Math.sin(st.psi);
  return out.set(st.x + rx*u, y, st.z + rz*u);
}

/* ------------------------------------------------------------------ Zustand */
let welt = null, fahrer = null, halter = null, schatten = null, laeuft = false;

function neustart(){
  fahrer = neuerFahrer(BIKES[aktRad]);

let montiert = null;
async function wechsleRad(id){
  if(!BIKES[id] || montiert === id) return;   // auf das MONTIERTE Rad prüfen,
  aktRad = id;                                // nicht auf das gewählte
  if(fahrer) fahrer.bike = BIKES[id];
  if(halter) scene.remove(halter);
  if(!radCache[id]) radCache[id] = await ladeFahrzeug(BIKES[id]);
  halter = radCache[id];
  scene.add(halter);
  montiert = id;
  $('vname').textContent = BIKES[id].name;
  document.querySelectorAll('#bikes .card').forEach(c =>
    c.setAttribute('aria-pressed', String(c.dataset.id === id)));
}

/* ------------------------------------------------------------------ Aufbau */
async function starte(){
  const track = TRACKS[aktStrecke];
  if(welt){
    scene.remove(welt.mesh); welt.mesh.geometry.dispose(); welt.mesh.material.dispose();
    for(const b of welt.baeume){ scene.remove(b); b.geometry.dispose(); b.material.dispose(); }
  }
  welt = baueStrecke(track);
  welt.baeume = baueBaeume(welt);
  scene.add(welt.mesh, ...welt.baeume);
  if(!schatten){ schatten = baueSchatten(); scene.add(schatten); }
  await wechsleRad(aktRad);
  neustart();
  $('start').classList.add('gone');
  $('hud').classList.add('on'); $('right').classList.add('on');
  hudAn = true; laeuft = true;
  timer.update(performance.now()); timer.getDelta();
  if(halter && halter.userData.quelle === 'ersatz'){
    meldung('Ersatzfahrer aktiv — ' + GLB_PFAD + ' nicht gefunden', 4500);
  }
}

/* ------------------------------------------------------------- Elementinfo */
let letztesElement = null;
function pruefeElement(){
  let treffer = null;
  for(const e of welt.track.elemente){
    const b = e.start_m + (e.laenge_m || 1.5);
    if(fahrer.s >= e.start_m - 2 && fahrer.s <= b + 2){ treffer = e; break; }
  }
  if(treffer !== letztesElement){
    letztesElement = treffer;
    if(treffer) meldung(treffer.typ.replace('_','-') + ' · ' + treffer.notiz, 4200);
  }
}

/* ---------------------------------------------------------------- Schleife */
let sichtbar = true;
document.addEventListener('visibilitychange', () => { sichtbar = !document.hidden; });

renderer.setAnimationLoop(() => {
  if(!sichtbar) return;
  timer.update(performance.now());
  const dt = Math.min(timer.getDelta(), 0.1);

  if(laeuft && welt && fahrer){
    leseEingabe();
    // Feste Teilschritte: bei 30 fps sonst andere Physik als bei 144 fps
    const n = Math.max(1, Math.ceil(dt/0.008));
    for(let i = 0; i < n; i++) schritt(welt, fahrer, dt/n, ein);

    if(fahrer.s >= welt.L){
      laeuft = false;
      meldung('Ziel · ' + Math.floor(fahrer.zeit/60) + ':' +
              (fahrer.zeit%60 < 10 ? '0' : '') + (fahrer.zeit%60).toFixed(1) +
              ' · ' + fahrer.luftGesamt.toFixed(1).replace('.',',') + ' s Luft' +
              ' · ' + fahrer.stuerze + ' Randkontakte · R für neu', 99999);
    }
    pruefeElement();
    schreibeHud(dt);

    // --- Fahrer setzen ---
    const st = stInterp(welt, fahrer.s);
    weltPos(welt, fahrer.s, fahrer.u, fahrer.y, _p);
    if(halter){
      halter.position.copy(_p);
      halter.rotation.set(0, 0, 0);
      halter.rotateY(-st.psi + Math.PI);
      halter.rotateX(-fahrer.tilt);
      halter.rotateZ(-fahrer.roll);
    }
    if(schatten){
      const sy = welt.flaeche(Math.min(fahrer.s, welt.L), fahrer.u);
      weltPos(welt, fahrer.s, fahrer.u, sy + 0.05, schatten.position);
      const hoch = Math.max(0, fahrer.y - sy);
      const sk = 1 + hoch*0.16;
      schatten.scale.set(sk, 1, sk);
      schatten.material.opacity = 0.42 / (1 + hoch*0.5);
    }

    // --- Kamera ---
    const km = KAMERAS[kamMode];
    const fx = Math.sin(st.psi), fz = Math.cos(st.psi);
    _camPos.set(_p.x - fx*km.hinten, _p.y + km.hoch, _p.z - fz*km.hinten);
    _camZiel.set(_p.x + fx*km.ziel, _p.y + 0.7, _p.z + fz*km.ziel);
    camera.position.lerp(_camPos, Math.min(1, dt*(kamMode === 1 ? 26 : 9)));
    // Die Kamera rollt nur teilweise mit: ohne Rollen ist ein Wallride nicht
    // lesbar, mit vollem Rollen wird einem schlecht.
    const roll = fahrer.roll * km.roll;
    _up.set(-Math.cos(st.psi)*Math.sin(-roll), Math.cos(roll), Math.sin(st.psi)*Math.sin(-roll));
    camera.up.copy(_up);
    camera.lookAt(_camZiel);
  }

  if(meldungTimer && performance.now() > meldungTimer){
    $('elem').classList.remove('on'); meldungTimer = 0;
  }
  renderer.render(scene, camera);
});

/* ---------------------------------------------------------------- Resize */
function resize(){
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if(!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w/h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas);
resize();

/* ---------------------------------------------------------------- Startmenü */
function karte(html, id, gedrueckt){
  const b = document.createElement('button');
  b.className = 'card'; b.type = 'button'; b.dataset.id = id;
  b.setAttribute('aria-pressed', String(gedrueckt));
  b.innerHTML = html;
  return b;
}

TRACKS.forEach((t, i) => {
  const spr = t.elemente.filter(e =>
    ['kicker','tabletop','step_up','step_down','drop','hip'].includes(e.typ)).length;
  const wr = t.elemente.filter(e => e.typ === 'wallride').length;
  const b = karte(
    `<div class="n">${t.name}</div><div class="d">${t.laenge_m} m · ${t.hoehendifferenz_m} hm · ` +
    `${(t.hoehendifferenz_m/t.laenge_m*100).toFixed(1)} % Gefälle<br>` +
    `${t.elemente.length} Elemente · ${spr} Sprünge · ${wr} Wallride${wr === 1 ? '' : 's'}</div>`,
    String(i), i === 0);
  b.onclick = () => {
    aktStrecke = i;
    document.querySelectorAll('#tracks .card').forEach((c, j) =>
      c.setAttribute('aria-pressed', String(j === i)));
  };
  $('tracks').appendChild(b);
});

Object.values(BIKES).forEach(bk => {
  const b = karte(`<div class="n">${bk.name}</div><div class="d">${bk.d}<br>${bk.masse} kg Systemmasse</div>`,
                  bk.id, bk.id === 'mtb');
  b.onclick = () => {
    aktRad = bk.id;
    document.querySelectorAll('#bikes .card').forEach(c =>
      c.setAttribute('aria-pressed', String(c.dataset.id === bk.id)));
  };
  $('bikes').appendChild(b);
});

$('note').innerHTML =
  'Liegt <code>' + GLB_PFAD + '</code> neben dieser Datei, wird das Modell geladen und auf 1,80 m ' +
  'eingemessen. Fehlt sie, fährt ein Ersatzfahrer aus Primitiven — die Seite läuft trotzdem.<br>' +
  'Die Datei braucht einen Server (<code>python3 -m http.server</code>), weil ES-Module unter ' +
  '<code>file://</code> von CORS blockiert werden.';

$('go').onclick = () => { starte().catch(e => zeigeFehler('Aufbau fehlgeschlagen: ' + e.message)); };

if(reduced){
  // Die Bewegung hier ist vom Nutzer ausgelöst, nicht dekorativ — die Fahrt
  // bleibt. Nur der Kameranachlauf wird härter, damit weniger geschwebt wird.
  KAMERAS.forEach(k => k.roll *= 0.4);
}

/* Prüfhaken: erlaubt es, die Geometrie von außen nachzumessen, statt sie
   aus dem Bild zu raten. Kostet nichts und hilft beim Einbau in ein anderes Spiel. */
window.bikepark = {querschnittBei, querV, aussenGrenze, profilPunkte, deltaH, baseHoehe,
                   baueStrecke, neuerFahrer, schritt,
                   get welt(){ return welt; }, get fahrer(){ return fahrer; }, TRACKS, BIKES};

addEventListener('pagehide', () => {
  renderer.setAnimationLoop(null);
  scene.traverse(o => {
    if(o.geometry) o.geometry.dispose();
    if(o.material){
      (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => {
        Object.values(m).forEach(v => v && v.isTexture && v.dispose());
        m.dispose();
      });
    }
  });
  renderer.dispose();
});
</script>
